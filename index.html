<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Uordoul</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%236aaa64'/><text x='50%' y='50%' font-family='Arial' font-weight='bold' font-size='75' fill='white' dominant-baseline='central' text-anchor='middle'>U</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>

    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Bem-vindo ao Uordoul</h2>
            <p>Faça login para salvar o seu rank, subir de patente e competir com seus amigos!</p>
            <button id="google-login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar com o Google
            </button>
        </div>
    </div>

    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title">Vitória!</h2>
            <div class="rank-container">
                <div class="result-rank-image-container">
                    <img id="result-rank-icon" src="" alt="" class="result-rank-icon">
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    <div id="progress-change-fill" class="progress-change-fill"></div>
                </div>
                <div class="points-info">
                    <span id="result-points-change">-- pts</span>
                    <span id="result-points-total">Total: --</span>
                </div>
            </div>
            <div class="stats-container">
                <p>Taxa de Acerto: <strong id="result-winrate">--%</strong></p>
            </div>
            <div class="share-container">
                <p>Compartilhe seu resultado:</p>
                <button id="share-btn">📋 Copiar Tentativas</button>
            </div>
            <button id="modal-leaderboard-btn" class="secondary-btn leaderboard-result-btn">
                🏆 Ver Ranking
            </button>
            <button id="close-result-btn" class="secondary-btn">Fechar</button>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content leaderboard-content">
            <h2 id="leaderboard-title">🏆 Ranking: Geral</h2>
            <div class="leaderboard-tabs" role="tablist" aria-label="Modos do ranking">
                <button class="leaderboard-tab active" data-leaderboard-mode="general">Geral</button>
                <button class="leaderboard-tab" data-leaderboard-mode="uordoul">Uordoul</button>
                <button class="leaderboard-tab" data-leaderboard-mode="duordoul">DUOrdoul</button>
                <button class="leaderboard-tab" data-leaderboard-mode="fourdoul">FOURdoul</button>
            </div>
            <div class="table-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th class="center-cell">Pontos</th>
                            <th class="center-cell">Patente</th>
                            <th class="center-cell">Win Rate</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <button id="close-leaderboard-btn" class="secondary-btn">Fechar</button>
        </div>
    </div>

    <header>
        <div class="brand-group">
            <button id="menu-toggle" class="menu-toggle" title="Modos de jogo" aria-label="Abrir modos de jogo" aria-expanded="false">☰</button>
            <h1 id="game-title">UORDOUL</h1>
        </div>
        <div class="header-actions">
            <button id="open-leaderboard-btn" title="Ranking">🏆</button>
            <div id="user-info">
                <div id="profile" class="hidden">
                    <img id="user-avatar" src="" alt="Avatar" referrerpolicy="no-referrer">
                    <div class="user-details">
                        <span id="user-name"></span>
                        <span id="user-rank"></span>
                    </div>
                    <button id="logout-btn" title="Sair">🚪</button>
                </div>
            </div>
        </div>
    </header>

    <nav id="game-nav" class="game-nav" aria-label="Modos de jogo">
        <div class="game-nav-inner">
            <button class="nav-item" data-mode="uordoul">Uordoul</button>
            <button class="nav-item" data-mode="duordoul">Duordoul</button>
            <button class="nav-item" data-mode="fourdoul">Fourdoul</button>
            <button class="nav-item" data-action="leaderboard">Classificação</button>
        </div>
    </nav>

    <main id="game-container">
        <div id="boards" class="boards-container"></div>
        <div id="keyboard"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
