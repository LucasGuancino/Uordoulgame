<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Uordoul</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%236aaa64'/><text x='50%' y='50%' font-family='Arial' font-weight='bold' font-size='75' fill='white' dominant-baseline='central' text-anchor='middle'>U</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        .uordoul-share-action[data-share-action="copy"],
        .uordoul-share-action[data-share-action="download"] { display: none !important; }
        .uordoul-share-actions { grid-template-columns: 1fr !important; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Bem-vindo ao Uordoul</h2>
            <p>Faça login para salvar o seu rank, subir de patente e competir com seus amigos!</p>
            <button id="google-login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continuar com o Google
            </button>
        </div>
    </div>

    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="result-title">Vitória!</h2>
            <div class="rank-container">
                <div class="result-rank-image-container">
                    <img id="result-rank-icon" src="" alt="" class="result-rank-icon">
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    <div id="progress-change-fill" class="progress-change-fill"></div>
                </div>
                <div class="points-info">
                    <span id="result-points-change">-- pts</span>
                    <span id="result-points-total">Total: --</span>
                </div>
            </div>
            <div class="stats-container">
                <p>Taxa de Acerto: <strong id="result-winrate">--%</strong></p>
            </div>
            <div class="share-container">
                <p>Compartilhe seu resultado:</p>
                <button id="share-btn">Compartilhar Resultado</button>
            </div>
            <button id="modal-leaderboard-btn" class="secondary-btn leaderboard-result-btn">
                🏆 Ver Ranking
            </button>
            <button id="close-result-btn" class="secondary-btn">Fechar</button>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content leaderboard-content">
            <h2 id="leaderboard-title">🏆 Ranking: Geral</h2>
            <div class="leaderboard-tabs" role="tablist" aria-label="Modos do ranking">
                <button class="leaderboard-tab active" data-leaderboard-mode="general">Geral</button>
                <button class="leaderboard-tab" data-leaderboard-mode="uordoul">Uordoul</button>
                <button class="leaderboard-tab" data-leaderboard-mode="duordoul">Duordoul</button>
                <button class="leaderboard-tab" data-leaderboard-mode="fourdoul">Fourdoul</button>
                <button class="leaderboard-tab" data-leaderboard-mode="palpitada">Palpitada</button>
            </div>
            <div class="table-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th class="center-cell">Pontos</th>
                            <th class="center-cell">Patente</th>
                            <th id="leaderboard-last-header" class="center-cell">Win Rate</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <button id="close-leaderboard-btn" class="secondary-btn">Fechar</button>
        </div>
    </div>

    <header>
        <div class="brand-group">
            <button id="menu-toggle" class="menu-toggle" title="Modos de jogo" aria-label="Abrir modos de jogo" aria-expanded="false">☰</button>
            <h1 id="game-title">UORDOUL</h1>
        </div>
        <div class="header-actions">
            <button id="open-leaderboard-btn" title="Ranking">🏆</button>
            <div id="user-info">
                <div id="profile" class="hidden">
                    <img id="user-avatar" src="" alt="Avatar" referrerpolicy="no-referrer">
                    <div class="user-details">
                        <span id="user-name"></span>
                        <span id="user-rank"></span>
                    </div>
                    <button id="logout-btn" title="Sair">🚪</button>
                </div>
            </div>
        </div>
    </header>

    <nav id="game-nav" class="game-nav" aria-label="Modos de jogo">
        <div class="game-nav-inner">
            <button class="nav-item" data-mode="uordoul">Uordoul</button>
            <button class="nav-item" data-mode="duordoul">Duordoul</button>
            <button class="nav-item" data-mode="fourdoul">Fourdoul</button>
            <button class="nav-item" onclick="window.location.href='palpitada.html'">Palpitada Geográfica</button>
            <button class="nav-item hidden" data-action="leaderboard" aria-hidden="true" tabindex="-1">Classificação</button>
        </div>
    </nav>

    <main id="game-container">
        <div id="boards" class="boards-container"></div>
        <div id="keyboard"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
    <script>
        (() => {
            const nativeFetch = window.fetch.bind(window);
            const nativeShare = navigator.share ? navigator.share.bind(navigator) : null;
            if (nativeShare) {
                navigator.share = data => nativeShare(data && Array.isArray(data.files) && data.files.length ? { files: data.files } : data);
            }
            const wordsTextPromise = nativeFetch('PalavrasTermo.txt', { cache: 'force-cache' }).then(response => {
                if (!response.ok) throw new Error();
                return response.text();
            });
            let shareFastMode = false;
            let shareCanvasMode = false;
            let palpitadaTitleDrawn = false;
            let resetTimer = null;

            window.fetch = function(input, init) {
                const url = typeof input === 'string' ? input : (input && input.url) || '';
                if (String(url).split('?')[0].endsWith('PalavrasTermo.txt') && init && init.cache === 'no-store') {
                    return wordsTextPromise
                        .then(text => new Response(text, { status: 200, headers: { 'Content-Type': 'text/plain; charset=utf-8' } }))
                        .catch(() => nativeFetch(input, init));
                }
                return nativeFetch(input, init);
            };

            try {
                const reference = firebase.firestore().collection('usuarios').doc('__share_cache__');
                const prototype = Object.getPrototypeOf(reference);
                const originalGet = prototype.get;
                prototype.get = function(options) {
                    if (shareFastMode && !options && typeof this.path === 'string' && this.path.startsWith('usuarios/')) {
                        return originalGet.call(this, { source: 'cache' }).catch(() => originalGet.call(this));
                    }
                    return originalGet.call(this, options);
                };
            } catch (_) {}

            const canvasPrototype = CanvasRenderingContext2D.prototype;
            const originalFillText = canvasPrototype.fillText;
            canvasPrototype.fillText = function(text, x, y, maxWidth) {
                const palpitadaTitle = shareCanvasMode && typeof text === 'string' && text.length === 1 && x > 600 && y >= 668 && y <= 678 && String(this.font).includes('29px');
                if (palpitadaTitle) {
                    if (!palpitadaTitleDrawn) {
                        palpitadaTitleDrawn = true;
                        this.save();
                        this.font = '700 25px Arial, sans-serif';
                        this.textAlign = 'center';
                        originalFillText.call(this, 'PALPITADA GEOGRÁFICA', 870, y);
                        this.restore();
                    }
                    return;
                }
                if (maxWidth === undefined) return originalFillText.call(this, text, x, y);
                return originalFillText.call(this, text, x, y, maxWidth);
            };

            const finishSharePatch = () => {
                shareFastMode = false;
                shareCanvasMode = false;
                if (resetTimer) {
                    clearTimeout(resetTimer);
                    resetTimer = null;
                }
            };

            const observer = new MutationObserver(() => {
                const overlay = document.getElementById('uordoul-share-overlay');
                if (overlay && !overlay.classList.contains('hidden')) finishSharePatch();
            });
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

            firebase.auth().onAuthStateChanged(user => {
                if (!user) return;
                const ref = firebase.firestore().collection('usuarios').doc(user.uid);
                ref.get({ source: 'cache' }).catch(() => ref.get()).catch(() => {});
            });

            window.addEventListener('click', event => {
                const button = event.target.closest && event.target.closest('#share-btn');
                if (!button) return;
                shareFastMode = true;
                shareCanvasMode = true;
                palpitadaTitleDrawn = false;
                if (resetTimer) clearTimeout(resetTimer);
                resetTimer = setTimeout(finishSharePatch, 30000);
            }, true);
        })();
    </script>
</body>
</html>
